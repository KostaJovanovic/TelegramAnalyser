[package]
name = "tga-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Swiss/International design system, in GPUI."

[dependencies]
gpui = { workspace = true }

# Only so `tokens::tests` can assert that the window's palette and the report's
# stylesheet still name the same colours. A drift check that lives in the same
# file as one of the two copies is a drift check that moves with it.
[dev-dependencies]
tga-report = { path = "../tga-report" }
