[package]
name = "tga-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Telegram export analyser."

[[bin]]
name = "TelegramAnalyser"
path = "src/main.rs"

[dependencies]
tga-read = { path = "../tga-read" }
tga-db = { path = "../tga-db" }
tga-docs = { path = "../tga-docs" }
tga-stats = { path = "../tga-stats" }
tga-metrics = { path = "../tga-metrics" }
tga-notes = { path = "../tga-notes" }
tga-report = { path = "../tga-report" }

# **`glow`, not `wgpu`, and `default-features = false` to get it.** This window
# is a text field, two tick boxes, a bar and three buttons; it does not need a
# modern graphics API, and wgpu drags in a compiler for one. glow is OpenGL,
# which every machine that can run Explorer already has.
#
# `default_fonts` is off because the window ships Geist and nothing else -- the
# report is set in it, and a window in a different typeface from the file it
# writes is two products.
eframe = { version = "0.33", default-features = false, features = ["glow"] }

# The native folder picker. Hand-rolling one means reimplementing the sidebar,
# the recent list and the path box, and getting a worse version of a dialog
# people already know.
rfd = "0.16"

anyhow = { workspace = true }

# The digest formats an attachment's inferred date, which is a `NaiveDate`.
chrono.workspace = true

# The command half reads a recorded --stats dump straight back into a `Stats`.
serde_json.workspace = true
