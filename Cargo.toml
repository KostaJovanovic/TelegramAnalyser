[workspace]
resolver = "2"
members = [
    "crates/tga-read",
    "crates/tga-notes",
    "crates/tga-metrics",
    "crates/tga-report",
    "crates/tga-cli",
    "crates/tga-ui",
    "crates/tga-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# **No `preserve_order`.** serde_json's default map is a BTreeMap, so objects
# serialise with their keys sorted -- which is exactly what the Python side
# emits under `json.dumps(..., sort_keys=True)`, and the whole verification
# story is diffing those two files. Turning `preserve_order` on swaps in an
# IndexMap and the diff fills with reordering noise.
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
anyhow = "1"

# Pinned exactly, not by caret, and for the reason `telegram_rust` states: gpui
# is pre-1.0, its README suggests `version = "*"`, and taking that advice means
# a routine `cargo update` can break the interface with no code change of ours.
# Bump it deliberately, on its own commit, with the parity legs green either
# side.
#
# `gpui-component` is deliberately **not** here. The exporter needs it for
# overlays and dropdowns; this window is a path field, a button, a theme
# toggle, two tick boxes, a 3px bar and a status line, and the folder picker is
# gpui's own `prompt_for_paths`. Skipping it drops roughly 14 MB of binary and
# a second pre-1.0 pin.
gpui = "=0.2.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Debug info for our own crates, none for their dependencies.
#
# Carried over from telegram_rust, where the lesson cost 45 GB: MSVC folds every
# dependency's debug info into each binary's own PDB, so one link produced a
# 350 MB PDB and every test binary got one of its own. `package."*"` matches
# every dependency and no workspace member, which is the right line -- stepping
# through our code and reading a backtrace are unchanged.
#
# This tree is far smaller than that one (no gpui, no Telegram client), so the
# setting is cheap insurance rather than a rescue. It stops being cheap in
# phase 4, when GPUI arrives.
[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
